name: Build Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android-twa :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-twa/app/build/outputs/apk/debug/app-debug.apk android-twa/app/build/outputs/apk/debug/tabu-akhdar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tabu-akhdar-apk
          path: android-twa/app/build/outputs/apk/debug/tabu-akhdar.apk
          if-no-files-found: error
